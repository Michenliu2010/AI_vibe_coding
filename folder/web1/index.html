<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>John Doe</h1>
        <h2>Student at XYZ High School</h2>
    </header>
    <main>
        <section id="school-info">
            <h3>School Information</h3>
            <p>XYZ High School, Grade 12</p>
        </section>
        <section id="hobbies-activities">
            <h3>Hobbies and Activities</h3>
            <ul>
                <li>Basketball</li>
                <li>Photography</li>
                <li>Volunteering</li>
            </ul>
        </section>
        <section id="favorite-subjects">
            <h3>Favorite Subjects</h3>
            <ul>
                <li>Mathematics</li>
                <li>Science</li>
                <li>History</li>
            </ul>
        </section>
        <section id="links">
            <h3>Links</h3>
            <ul>
                <li><a href="https://github.com/johndoe" target="_blank">GitHub</a></li>
                <li><a href="https://www.linkedin.com/in/johndoe" target="_blank">LinkedIn</a></li>
                <li><a href="https://johndoeportfolio.com" target="_blank">Portfolio</a></li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 John Doe</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
