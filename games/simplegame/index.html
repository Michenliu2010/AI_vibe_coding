<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hit the Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud">
        <div class="stat-box">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat-box">
          <span class="label">Time</span>
          <span id="timer" class="value">30</span>
        </div>
        <div class="stat-box">
          <span class="label">Best</span>
          <span id="best-score" class="value">0</span>
        </div>
      </section>

      <h1>Hit the Button</h1>

      <div class="controls">
        <button id="start-btn" class="primary-btn">Start Game</button>
        <button id="reset-btn" class="secondary-btn" type="button">Reset Best</button>
      </div>

      <div id="game-area" class="game-area" aria-label="Game area">
        <button id="target-btn" class="target-btn" type="button" aria-label="Target button">
          Hit Me!
        </button>
      </div>

      <p id="status" class="status">Press start to begin.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
