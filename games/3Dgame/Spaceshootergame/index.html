<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b10" />
    <title>Driftwake - Salvage Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-label="Driftwake space shooter">
      <div id="viewport" class="viewport" aria-label="3D game view"></div>

      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Driftwake home"><span class="mark">D</span> DRIFTWAKE</a>
        <div class="run-meta">
          <span class="meta-label">SALVAGE RUN</span>
          <span class="run-divider"></span>
          <span id="sector-label">SECTOR <b>01</b> / 03</span>
        </div>
        <button id="sound-button" class="icon-button" type="button" aria-label="Toggle sound" title="Toggle sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M17 9a5 5 0 0 1 0 6M19.5 6.5a9 9 0 0 1 0 11"/></svg>
        </button>
      </header>

      <section class="hud" aria-label="Run status">
        <div class="hud-block score-block">
          <span class="eyebrow">RUN SCORE</span>
          <strong id="score-value">000000</strong>
        </div>
        <div class="hud-block salvage-block">
          <span class="eyebrow">SALVAGE</span>
          <strong><span class="salvage-gem"></span><span id="salvage-value">00</span></strong>
        </div>
        <div class="hull-block">
          <div class="hull-label"><span class="eyebrow">HULL INTEGRITY</span><span id="hull-count">05 / 05</span></div>
          <div id="hull-meter" class="hull-meter" aria-label="Hull integrity"></div>
        </div>
        <div class="objective-block">
          <span class="eyebrow">FLIGHT DIRECTOR</span>
          <strong id="objective-value">AWAITING LAUNCH</strong>
        </div>
      </section>

      <div class="reticle" aria-hidden="true"><span></span><i></i></div>

      <div class="bottomline">
        <div class="flight-readout"><span class="live-dot"></span><span id="flight-state">SYSTEMS STANDBY</span></div>
        <div class="key-guide"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> STEER</span><span><kbd>SPACE</kbd> FIRE</span><span><kbd>SHIFT</kbd> DASH</span></div>
        <div class="depth-readout"><span>DRIFT</span><strong id="drift-value">0.0</strong></div>
      </div>

      <section id="screen" class="screen" aria-live="polite">
        <div class="screen-content" id="screen-content"></div>
      </section>

      <div class="touch-controls" aria-label="Touch flight controls">
        <div class="touch-dpad">
          <button type="button" data-control="up" aria-label="Steer up">&#9650;</button>
          <button type="button" data-control="left" aria-label="Steer left">&#9664;</button>
          <button type="button" data-control="down" aria-label="Steer down">&#9660;</button>
          <button type="button" data-control="right" aria-label="Steer right">&#9654;</button>
        </div>
        <div class="touch-actions">
          <button type="button" data-control="dash" class="touch-dash">DASH</button>
          <button type="button" data-control="fire" class="touch-fire">FIRE</button>
        </div>
      </div>
    </main>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
